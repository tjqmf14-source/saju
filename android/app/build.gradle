plugins {
    id 'com.android.application'
}
android {
    namespace 'kr.naesaju.personal'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.naesaju.personal'
        minSdk 24
        targetSdk 35
        versionCode 220
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/assets'))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def webDist = rootProject.file('../dist')
def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(webDist)
    into(layout.buildDirectory.dir('generated/assets/site'))
    includeEmptyDirs = false
    doFirst {
        if (!new File(webDist, 'index.html').isFile()) {
            throw new GradleException('Vite dist/index.html is missing. Build the website first.')
        }
    }
}

tasks.configureEach { task ->
    def needsWebAssets = (task.name.startsWith('merge') && task.name.endsWith('Assets'))
            || task.name.toLowerCase().contains('lint')
    if (needsWebAssets) {
        task.dependsOn(syncWebAssets)
    }
}
