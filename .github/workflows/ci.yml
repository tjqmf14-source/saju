name: CI

on:
  push:
    branches:
      - main
      - feature/offline-saju-v2
      - 'gpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run visual:check
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-v20-visual-qa
          path: test-results/*.png
          if-no-files-found: ignore

      - name: Publish verified commit status
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST
          repos/${{ github.repository }}/statuses/${{ github.sha }}
          -f state=success
          -f context=ci/verify
          -f description='V20 unit, privacy, build and Chromium QA passed'
          -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      - name: Publish failed commit status
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST
          repos/${{ github.repository }}/statuses/${{ github.sha }}
          -f state=failure
          -f context=ci/verify
          -f description='Verification failed; inspect the workflow run'
          -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
