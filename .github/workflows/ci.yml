name: CI

on:
  push:
    branches:
      - main
      - feature/offline-saju-v2
      - 'gpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - run: npm run check:android-engine
      - name: Publish verified commit status
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST
          repos/${{ github.repository }}/statuses/${{ github.sha }}
          -f state=success
          -f context=ci/verify
          -f description='Unit, privacy and legacy reference checks passed'
          -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Publish failed commit status
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST
          repos/${{ github.repository }}/statuses/${{ github.sha }}
          -f state=failure
          -f context=ci/verify
          -f description='Verification failed; inspect the workflow run'
          -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  build-android-native:
    if: github.ref == 'refs/heads/gpt/sajutaro-android-rebuild' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install engine build dependencies
        run: npm install

      - name: Build local calculation engine asset
        run: npm run build:android-engine

      - name: Build native Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Verify native Android package
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          grep -q "versionName '4.0.0'" android/app/build.gradle
          grep -q "versionCode 400" android/app/build.gradle
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

      - name: Prepare native APK artifact
        run: |
          mkdir -p mobile/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk mobile/artifacts/Sajutaro-4.0.0-debug.apk
          sha256sum mobile/artifacts/Sajutaro-4.0.0-debug.apk > mobile/artifacts/SHA256SUMS.txt

      - name: Upload native APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sajutaro-V4-Native-Debug
          path: mobile/artifacts/*
          if-no-files-found: error
          retention-days: 30

  android-ui-smoke:
    if: github.ref == 'refs/heads/gpt/sajutaro-android-rebuild' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: build-android-native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Build local calculation engine asset
        run: npm run build:android-engine

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run native UI smoke tests at 320dp, 360dp large-font, and 412dp
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p mobile/ui-qa/320 mobile/ui-qa/360-large mobile/ui-qa/412

            adb shell wm size 640x1136
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            ./android/gradlew -p android connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/kr.naesaju.personal/files/. mobile/ui-qa/320/

            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            ./android/gradlew -p android connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/kr.naesaju.personal/files/. mobile/ui-qa/360-large/

            adb shell wm size 824x1648
            adb shell wm density 320
            adb shell settings put system font_scale 1.0
            ./android/gradlew -p android connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/kr.naesaju.personal/files/. mobile/ui-qa/412/

            test -s mobile/ui-qa/320/qa-home.png
            test -s mobile/ui-qa/360-large/qa-home.png
            test -s mobile/ui-qa/412/qa-home.png
            test "$(find mobile/ui-qa -name 'qa-*.png' -type f | wc -l)" -ge 18

      - name: Upload Android UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sajutaro-V4-AndroidTest-Diagnostics
          path: |
            android/app/build/reports/androidTests/connected/debug/**
            android/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native UI QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sajutaro-V4-Native-UI-QA
          path: mobile/ui-qa/**/*.png
          if-no-files-found: error
          retention-days: 30
