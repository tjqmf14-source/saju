name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - gpt/mobile-app-v1
      - gpt/deep-interpretation-mobile-v3
      - gpt/deep-reading-jumsin
      - gpt/plugin-reference-accuracy-v24
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'site-v12.css'
      - 'package.json'
      - 'android/**'
      - 'mobile/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Verify and build web app
        run: npm run check

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew lintDebug assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          grep -q "versionName '2.4.0'" android/app/build.gradle
          grep -q "versionCode 240" android/app/build.gradle
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

      - name: Prepare artifact
        run: |
          mkdir -p mobile/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk mobile/artifacts/Naesaju-2.4.0-debug.apk
          sha256sum mobile/artifacts/Naesaju-2.4.0-debug.apk > mobile/artifacts/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Naesaju-Android-Debug
          path: mobile/artifacts/*
          if-no-files-found: error
          retention-days: 30
